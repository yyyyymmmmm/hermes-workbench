name: Windows Preview
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node server/scripts/check-publication.mjs
      - run: npm test
      - run: npm run desktop:build
      - uses: actions/upload-artifact@v4
        with:
          name: hermes-windows-x64-unsigned
          path: dist/Hermes Workbench-win32-x64/
          if-no-files-found: error
          retention-days: 7
